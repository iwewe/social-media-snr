repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-yaml
        # compose.tls.yaml memakai tag Compose `!reset` (bukan YAML standar); divalidasi docker compose config.
        exclude: ^compose\.tls\.yaml$
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: secret-scan
        name: pemindai rahasia (cookie/token/kunci)
        entry: python3 tests/tools/secret_scan.py
        language: system
        pass_filenames: true
