# Overlay HTTPS (WP-3.6b; ADR 0035): TLS di depan aplikasi.
#   docker compose -f compose.yaml -f compose.tls.yaml --profile build run --rm frontend-build
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build
# Aplikasi memakai gunicorn (bukan runserver) dan frontend dilayani sebagai berkas statis hasil build.
# Frontend dev (vite) hanya aktif dengan `--profile dev`. Variabel .env tambahan: SNR_DOMAIN,
# DJANGO_ALLOWED_HOSTS (= domain), DJANGO_CSRF_TRUSTED_ORIGINS (= https://domain), SNR_TLS (lihat Caddyfile).

services:
  web:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?isi DJANGO_SECRET_KEY di .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?isi DJANGO_ALLOWED_HOSTS (domain) di .env}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?isi DJANGO_CSRF_TRUSTED_ORIGINS di .env}
      POSTGRES_DB: ${POSTGRES_DB:-snr}
      POSTGRES_USER: ${POSTGRES_USER:-snr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_HOST: postgres
      CELERY_BROKER_URL: redis://valkey:6379/0
      SNR_DATA_ROOT: /srv/snr
      SNR_HTTPS: "1"
      SNR_HSTS_SECONDS: ${SNR_HSTS_SECONDS:-3600}
    ports: !reset []
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
      - ${SNR_HOST_DATA:-./snr-data}/evidence:/srv/snr/evidence
      - ${SNR_HOST_DATA:-./snr-data}/exports:/srv/snr/exports
      - ${SNR_HOST_DATA:-./snr-data}/static:/app/staticfiles
    healthcheck:
      # Pemeriksaan internal lewat HTTP polos; header proxy dipalsukan agar tidak dianggap tidak aman.
      test: ["CMD", "python", "-c", "import urllib.request as u; r = u.Request('http://localhost:8000/admin/login/', headers={'Host': '${SNR_DOMAIN:-localhost}', 'X-Forwarded-Proto': 'https'}); u.urlopen(r)"]

  proxy:
    image: caddy:2.10.2
    depends_on:
      web:
        condition: service_healthy
    environment:
      SNR_DOMAIN: ${SNR_DOMAIN:-localhost}
      SNR_TLS: ${SNR_TLS:-internal}
    ports:
      - "${SNR_BIND_ADDR:-127.0.0.1}:${SNR_HTTP_PORT:-80}:80"
      - "${SNR_BIND_ADDR:-127.0.0.1}:${SNR_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - ${SNR_HOST_DATA:-./snr-data}/static:/srv/static:ro
      - caddy_data:/data
      - ${SNR_CERTS_DIR:-./snr-data/certs}:/certs:ro
    restart: unless-stopped

  frontend:
    profiles: ["dev"]

  frontend-build:
    image: node:24
    profiles: ["build"]
    user: "${SNR_UID:-1000}:${SNR_GID:-1000}"
    working_dir: /app
    command: sh -c "npm ci && npm run build"
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app

volumes:
  caddy_data:
