# Lingkungan pengembangan MVP SNR (modular monolith + worker terpisah).
# Jalankan: make up   (membuat direktori data lalu docker compose up -d --build)

x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?isi DJANGO_SECRET_KEY di .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_DB: ${POSTGRES_DB:-snr}
  POSTGRES_USER: ${POSTGRES_USER:-snr}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
  POSTGRES_HOST: postgres
  CELERY_BROKER_URL: redis://valkey:6379/0
  SNR_DATA_ROOT: /srv/snr
  SNR_SWEEP_OLDER_THAN_SECONDS: ${SNR_SWEEP_OLDER_THAN_SECONDS:-}
  SNR_SWEEP_INTERVAL_SECONDS: ${SNR_SWEEP_INTERVAL_SECONDS:-}

x-backend-base: &backend-base
  user: "${SNR_UID:-1000}:${SNR_GID:-1000}"
  environment: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    user: "${SNR_UID:-1000}:${SNR_GID:-1000}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snr}
      POSTGRES_USER: ${POSTGRES_USER:-snr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - ${SNR_HOST_DATA:-./snr-data}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    <<: *backend-base
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      target: app
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./tests:/tests
      - ./compose.yaml:/compose.yaml:ro  # dibaca tes isolasi
      - ./docs:/docs:ro  # dibaca tes dokumen kelayakan adapter (WP-3.0)
      - ./.env.example:/.env.example:ro  # dibaca tes konfigurasi penyapu
      - ./datasets:/datasets:ro  # dataset uji/impor (WP-1.7); dibaca tes dan adapter dataset
      - ${SNR_HOST_DATA:-./snr-data}/evidence:/srv/snr/evidence
      - ${SNR_HOST_DATA:-./snr-data}/exports:/srv/snr/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/admin/login/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker-analysis:
    <<: *backend-base
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      target: app
    command: celery -A config worker -Q analysis,celery -l info
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
      - ${SNR_HOST_DATA:-./snr-data}/evidence:/srv/snr/evidence

  # Penjadwal (celery beat): hanya mengirim tugas penyapu run basi ke antrean. Tidak memasang evidence
  # maupun browser-profiles. Aktif bila SNR_SWEEP_OLDER_THAN_SECONDS dan SNR_SWEEP_INTERVAL_SECONDS
  # keduanya diisi di .env; tanpa itu proses ini hanya menganggur.
  scheduler:
    <<: *backend-base
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      target: app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app

  # Hanya worker ini yang melihat browser-profiles (PRD bagian 10: sesi browser terpisah dari bukti).
  worker-browser:
    <<: *backend-base
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile
      target: browser
    command: celery -A config worker -Q browser -c 1 -l info  # profil Chromium: satu proses
    volumes:
      - ./backend:/app
      - ${SNR_HOST_DATA:-./snr-data}/evidence:/srv/snr/evidence
      - ${SNR_HOST_DATA:-./snr-data}/browser-profiles:/srv/snr/browser-profiles

  frontend:
    image: node:24
    user: "${SNR_UID:-1000}:${SNR_GID:-1000}"
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      HOME: /tmp
      VITE_API_PROXY: http://web:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
    restart: unless-stopped
